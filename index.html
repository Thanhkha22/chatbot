  <script>



let conversationMemory = JSON.parse(localStorage.getItem("chatMemory") || "[]");

async function askGemini(prompt, imageData = null) {
  prompt = `Thời gian hiện tại (giờ Việt Nam): ${new Date().toLocaleString("vi-VN", { timeZone: "Asia/Ho_Chi_Minh" })}\n\n${prompt}`;
  let searchContext = "";
  try {
    const res = await fetch(
      `https://www.googleapis.com/customsearch/v1?key=${GOOGLE_SEARCH_KEY}&cx=${SEARCH_ENGINE_ID}&q=${encodeURIComponent(prompt)}`
    );

    const data = await res.json();

    if (data.items && data.items.length > 0) {
      searchContext = data.items
        .slice(0, 3)
        .map(
          (item, i) =>
            `${i + 1}. ${item.title}\n${item.snippet}\n(${item.link})`
        )
        .join("\n\n");
    }
  } catch (err) {
    console.warn("⚠️ Không thể truy xuất Google Search:", err);
  }

  const lastMessages = conversationMemory.slice(-5)
    .map(m => `${m.role === "user" ? "Người dùng" : "AI"}: ${m.text}`)
    .join("\n");

  const fullPrompt = `
Bạn là một AI thân thiện, có khả năng nhận diện hình ảnh, vật thể, nhân vật, biểu tượng hoặc tựa game trong ảnh người dùng gửi.
Khi người dùng gửi ảnh, hãy mô tả nội dung bức ảnh thật cụ thể và nếu có thể, hãy nhận diện:
- Tên trò chơi, nhân vật, bối cảnh hoặc logo xuất hiện.
- Loại game (ví dụ: MOBA, FPS, RPG, v.v.)
- Cảm nhận tổng quan (ví dụ: cổ điển, hiện đại, anime, 3D, pixel-art,...)

Nếu không chắc chắn, hãy nêu các khả năng có thể đúng nhất.  
Sau đó, liên hệ đến kỹ năng, tính cách hoặc nghề nghiệp tương ứng nếu có thể.  

🎯 Khi người dùng gửi ảnh:
- Hãy mô tả nội dung bức ảnh.
- Nếu ảnh có thể gợi liên hệ đến học tập, kỹ năng, hoặc nghề nghiệp → gợi ý hướng phù hợp.

📘 Khi người dùng gửi file văn bản:
- Hãy tóm tắt và phân tích nội dung chính.
- Nếu phù hợp, gợi ý ngành học liên quan.

Luôn trò chuyện ngắn gọn, dễ hiểu, có thể dùng emoji, xuống dòng hợp lý.

-----------------------------
🧠 **Ngữ cảnh hội thoại trước đó:**
${lastMessages || "(chưa có hội thoại trước đó)"}

🌐 **Thông tin tham khảo từ Google:**
${searchContext || "Không tìm thấy thông tin trên web."}

Người dùng nói: ${prompt}
`;

  // 🧩 Chuẩn bị phần nội dung gửi tới Gemini
  const parts = [{ text: fullPrompt }];

  // Nếu có ảnh (base64) → thêm vào payload
  if (imageData) {
    try {
      const base64Data = imageData.split(',')[1]; // bỏ phần "data:image/jpeg;base64,"
      const mimeType = imageData.split(';')[0].split(':')[1] || "image/jpeg";

      parts.push({
        inline_data: { mime_type: mimeType, data: base64Data }
      });
    } catch (err) {
      console.warn("⚠️ Không thể xử lý dữ liệu hình ảnh:", err);
    }
  }

  // 🚀 Gọi Gemini API
  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts }]
      }),
    }
  );

  const data = await response.json();

  const reply =
    data.candidates?.[0]?.content?.parts?.[0]?.text ||
    "⚠️ Không có phản hồi từ AI.";

  // 💾 Lưu hội thoại
  conversationMemory.push({ role: "user", text: prompt });
  conversationMemory.push({ role: "ai", text: reply });
  localStorage.setItem("chatMemory", JSON.stringify(conversationMemory.slice(-10)));

  return reply;
}

function isUserAtBottom(chatBox) {
  return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 50;
}

async function typeText(container, text, delay = 10) {
  container.innerHTML = "";
  let temp = "";
  const chatBox = document.getElementById("chat");

  for (let i = 0; i < text.length; i++) {
    temp += text.charAt(i);
    container.innerHTML = temp;

    

    await new Promise(r => setTimeout(r, delay));
  }

  container.innerHTML = text;

  
}


async function sendMsg(message = null) {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = message || input.value.trim();

  if (!text && !uploadedImageBase64) return;

  // --- 1️⃣ Thêm message user vào chat ---
  let bubbleContent = "";
  if (uploadedImageBase64) {
    bubbleContent += `<img src="${uploadedImageBase64}" style="max-width:100%; border-radius:8px; margin-bottom:6px;">`;
  }
  if (text) {
    bubbleContent += `<span>${text}</span>`;
  }

  chat.innerHTML += `
    <div class="msg user">
      <div class="bubble" style="display:flex; flex-direction:column; align-items:flex-start; gap:4px;">
        ${bubbleContent}
      </div>
      <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="User" />
    </div>
  `;


  chat.scrollTop = chat.scrollHeight;

  // --- 2️⃣ Clear ngay input và ảnh ---
  input.value = "";
  document.getElementById("imagePreviewContainer").innerHTML = "";
  const sentImage = uploadedImageBase64; // giữ tạm ảnh để gửi
  uploadedImageBase64 = null;

  // --- 3️⃣ Thêm message bot “đang phân tích” ---
  const botMsg = document.createElement("div");
  botMsg.className = "msg bot";
  botMsg.innerHTML = `
    <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="AI" />
    <div class="bubble typing-bubble">Vui lòng chờ trong giây lát<span class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>`;
  chat.appendChild(botMsg);
  
  const bubble = botMsg.querySelector(".bubble");

  try {
    // --- 4️⃣ Gửi dữ liệu cho bot ---
    const reply = await askGemini(text || "(chỉ ảnh)", sentImage);
    const cleanReply = reply.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
    await typeText(bubble, cleanReply, 18);
  } catch (e) {
    bubble.innerHTML = "⚠️ Lỗi: " + e.message;
  }

  chat.scrollTop = chat.scrollHeight;
}



let uploadedImageBase64 = null; // lưu ảnh upload tạm thời
document.getElementById("imagePreviewContainer").innerHTML = "";
input.value = "";

async function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (file.type.startsWith("image/")) {
    const reader = new FileReader();
    reader.onload = (e) => {
      uploadedImageBase64 = e.target.result;

      const previewContainer = document.getElementById("imagePreviewContainer");
      previewContainer.innerHTML = "";
      const imgEl = document.createElement("img");
      imgEl.src = uploadedImageBase64;
      imgEl.style.width = "40px";
      imgEl.style.height = "40px";
      imgEl.style.borderRadius = "5px";
      previewContainer.appendChild(imgEl);
    };
    reader.readAsDataURL(file);
  }

  document.getElementById("fileUpload").value = "";
}

async function handleKey(event) {
  if (event.key !== "Enter") return;

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();

  if (!text && !uploadedImageBase64) return;

  // Tạo nội dung bubble user
  let bubbleContent = "";
  if (uploadedImageBase64) {
  bubbleContent += `<img src="${uploadedImageBase64}" style="width:150px;height:auto;border-radius:8px; margin-right:6px;">`;
}

  if (text) {
    bubbleContent += `<span>${text}</span>`;
  }

  // Thêm message user vào chat
  chat.innerHTML += `
    <div class="msg user">
      <div class="bubble" style="display:flex; align-items:center; gap:6px;">
        ${bubbleContent}
      </div>
      <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="User" />
    </div>
  `;
  chat.scrollTop = chat.scrollHeight;

  // Nếu có ảnh, gửi ảnh + nội dung cho bot
  if (uploadedImageBase64) {
    const botMsg = document.createElement("div");
    botMsg.className = "msg bot";
    botMsg.innerHTML = `
      <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" />
      <div class="bubble typing-bubble">🧠 Đang phân tích hình ảnh và nội dung...</div>
    `;
    chat.appendChild(botMsg);
    const bubble = botMsg.querySelector(".bubble");

    try {
      const reply = await askGemini(
        `Hãy mô tả và phân tích hình ảnh này cùng nội dung sau: "${text}"`,
        uploadedImageBase64
      );
      const cleanReply = reply.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
      await typeText(bubble, cleanReply, 18);
    } catch (err) {
      bubble.innerHTML = "⚠️ Lỗi: " + err.message;
    }

    uploadedImageBase64 = null; // reset ảnh sau khi gửi
    document.getElementById("imagePreviewContainer").innerHTML = ""; // xóa thumbnail
  }

  input.value = "";
}






    function sendQuick(text) {
      document.getElementById("input").value = text;
      sendMsg(text);
    }
    
    function isUserAtBottom(chatBox) {
      return chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 50;
    }

  </script>

  <script>
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: "651931498757-b81tibe02fm08puv5tacju8qs97dnqrt.apps.googleusercontent.com",
        callback: handleCredentialResponse,
      });

      google.accounts.id.renderButton(
        document.getElementById("g_id_signin"),
        { theme: "outline", size: "large" }
      );

      document.getElementById("googleSection").addEventListener("click", (e) => {
        e.stopPropagation(); // tránh xung đột click ngoài
        
        const savedUser = JSON.parse(localStorage.getItem("googleUser") || "null");
        const dropdown = document.getElementById("logoutDropdown");
        
        if (savedUser) {
          // Đã đăng nhập → toggle menu đăng xuất
          dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
        } else {
          // Chưa đăng nhập → mở Google Sign-In
          document.querySelector("#g_id_signin div[role=button]").click();
        }
      });
      
      // Ẩn menu khi click ra ngoài
      document.addEventListener("click", (e) => {
        const dropdown = document.getElementById("logoutDropdown");
        const googleSec = document.getElementById("googleSection");
        if (!googleSec.contains(e.target)) dropdown.style.display = "none";
      });

    };
    // 🔹 Khôi phục đăng nhập nếu có sẵn
    const savedUser = JSON.parse(localStorage.getItem("googleUser") || "null");
    if (savedUser) {
      const avatar = document.getElementById("userAvatar");
      avatar.src = savedUser.picture || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
      avatar.title = `${savedUser.name} (${savedUser.email})`;
    }
    // 🔹 Xử lý đăng xuất
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("googleUser"); // Xóa thông tin đăng nhập
      google.accounts.id.disableAutoSelect(); // Hủy đăng nhập tự động Google
      location.reload(); // Làm mới lại giao diện
    });



    function handleCredentialResponse(response) {
      const data = parseJwt(response.credential);
      const avatar = document.getElementById("userAvatar");

      if (data.picture) {
        avatar.src = data.picture;
        avatar.title = `${data.name} (${data.email})`;
      } else {
        avatar.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
      }

      const chat = document.getElementById("chat");
      chat.innerHTML += `
        <div class='msg bot'>
          <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" />
          <div class='bubble'>Xin chào <b>${data.given_name || data.name}</b> 👋! Rất vui được đồng hành cùng bạn trong hành trình chọn ngành!</div>
        </div>`;
      chat.scrollTop = chat.scrollHeight;

      localStorage.setItem("googleUser", JSON.stringify(data));
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }
  </script>

  <script>
  const menuIcon = document.getElementById("menuIcon");
  const sidebar = document.getElementById("sidebarMenu");
  const chatContainer = document.querySelector(".chat-container");

  menuIcon.addEventListener("click", () => {
    const isActive = sidebar.classList.toggle("active");
    chatContainer.classList.toggle("shifted", isActive);
  });

  document.addEventListener("click", (e) => {
    if (!sidebar.contains(e.target) && !menuIcon.contains(e.target)) {
      sidebar.classList.remove("active");
      chatContainer.classList.remove("shifted");
    }
  });
</script>

<script>
let chatHistory = JSON.parse(localStorage.getItem("chatHistory") || "[]");
let currentChat = null;

function renderChatList() {
  const sidebar = document.getElementById("sidebarMenu");
  let list = document.getElementById("chatList");
  if (!list) {
    list = document.createElement("div");
    list.id = "chatList";
    sidebar.appendChild(list);
  }

  list.innerHTML = chatHistory
    .map((c, i) => `
      <div class="chat-item ${c.pinned ? 'pinned' : ''}">
        <span class="chat-title" onclick="loadChat(${i})">
          ${c.pinned ? '<i class="fa-solid fa-thumbtack" style="color:#0078ff; margin-right:6px;"></i>' : ''}
          ${c.pinned ? `<strong>${c.name}</strong>` : c.name}
        </span>
        <div class="dropdown">
          <button class="menu-btn" onclick="toggleMenu(${i})">⋮</button>
          <div class="menu" id="menu-${i}">
            <button onclick="renameChat(${i})">Đổi tên</button>
            <button onclick="pinChat(${i})">${c.pinned ? 'Bỏ ghim' : 'Ghim'}</button>
            <button onclick="shareChat(${i})">Chia sẻ</button>
            <button onclick="deleteChat(${i})">Xóa</button>
          </div>
        </div>
      </div>
    `)
    .join("");
}

function saveCurrentChat() {
  const chatBox = document.getElementById("chat");
  if (!chatBox || chatBox.innerHTML.trim() === "") return;

  const content = chatBox.innerHTML;
  if (currentChat !== null) {
    chatHistory[currentChat].content = content;
  } else {
    const firstMsg = chatBox.querySelector(".msg.user .bubble")?.innerText || "Cuộc trò chuyện mới";
    chatHistory.unshift({ name: firstMsg.substring(0, 30), content, pinned: false });
    currentChat = 0;
  }

  localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
  renderChatList();
}



function newChat() {
  saveCurrentChat();

  const chatBox = document.getElementById("chat");
  chatBox.innerHTML = `
    <div class="msg bot">
      <img class="avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" alt="AI" />
      <div class="bubble">Xin chào 👋 Tôi là cố vấn hướng nghiệp AI. Hãy nói cho tôi biết sở thích hoặc điểm mạnh của bạn nhé!</div>
    </div>`;
  currentChat = null;
}

function loadChat(index) {
  const chatBox = document.getElementById("chat");
  chatBox.innerHTML = chatHistory[index].content;
  currentChat = index;
}

function deleteChat(index) {
  chatHistory.splice(index, 1);
  localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
  renderChatList();
}

function renameChat(index) {
  const newName = prompt("Nhập tên mới:", chatHistory[index].name);
  if (newName) {
    chatHistory[index].name = newName;
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
    renderChatList();
  }
}

function pinChat(index) {
  const chat = chatHistory[index];
  chat.pinned = !chat.pinned; 

  if (chat.pinned) {
    chatHistory.splice(index, 1);
    chatHistory.unshift(chat);
  }

  localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
  renderChatList();
}

function shareChat(index) {
  const text = chatHistory[index].content
    .replace(/<[^>]+>/g, "") 
    .slice(0, 1000); 
  const encoded = encodeURIComponent(text);

  window.open(`https://zalo.me/share/text?text=${encoded}`, "_blank");
}


function toggleMenu(i) {
  const currentMenu = document.getElementById(`menu-${i}`);
  const isOpen = currentMenu.style.display === "block";

  document.querySelectorAll(".menu").forEach(m => (m.style.display = "none"));
  document.querySelectorAll(".chat-item").forEach(it => it.classList.remove("open"));

  if (!isOpen) {
    currentMenu.style.display = "block";
    currentMenu.closest(".chat-item").classList.add("open");
  }
}



renderChatList();
document.getElementById("sidebarMenu").addEventListener("click", (e) => {
  if (!e.target.closest(".menu-btn") && !e.target.closest(".menu")) {
    document.querySelectorAll(".menu").forEach(m => (m.style.display = "none"));
    document.querySelectorAll(".chat-item").forEach(it => it.classList.remove("open"));
  }
});
</script>

<script>

function normalizeVietnamese(str) {
  const map = {
    á:"a",à:"a",ả:"a",ã:"a",ạ:"a",ă:"a",ắ:"a",ằ:"a",ẳ:"a",ẵ:"a",ặ:"a",
    â:"a",ấ:"a",ầ:"a",ẩ:"a",ẫ:"a",ậ:"a",é:"e",è:"e",ẻ:"e",ẽ:"e",ẹ:"e",
    ê:"e",ế:"e",ề:"e",ể:"e",ễ:"e",ệ:"e",í:"i",ì:"i",ỉ:"i",ĩ:"i",ị:"i",
    ó:"o",ò:"o",ỏ:"o",õ:"o",ọ:"o",ô:"o",ố:"o",ồ:"o",ổ:"o",ỗ:"o",ộ:"o",
    ơ:"o",ớ:"o",ờ:"o",ở:"o",ỡ:"o",ợ:"o",ú:"u",ù:"u",ủ:"u",ũ:"u",ụ:"u",
    ư:"u",ứ:"u",ừ:"u",ử:"u",ữ:"u",ự:"u",ý:"y",ỳ:"y",ỷ:"y",ỹ:"y",ỵ:"y",đ:"d"
  };
  return str
    .toLowerCase()
    .replace(/[.,!?;:]/g, " ")      
    .replace(/[\u00A0\t\n\r]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .split("")
    .map(c => map[c] || c)
    .join("");
}

function isEnglish(str) { return /^[a-z\s]+$/i.test(str); }

function isMatch(text, keyword) {
  const tNorm = normalizeVietnamese(text);
  const kNorm = normalizeVietnamese(keyword);
  const keywords = kNorm.split(" "); 
  return keywords.every(k => tNorm.includes(k)); 
}

const searchInput = document.querySelector('.search-box input');
searchInput.addEventListener('input', function () {
  const keyword = this.value.trim();
  const chatItems = document.querySelectorAll('#chatList .chat-item');
  let found = false;

  chatItems.forEach(item => {
    const title = item.querySelector('.chat-title')?.textContent || '';
    const preview = item.querySelector('.chat-preview')?.textContent || '';
    const content = item.querySelector('.chat-content, .bubble, .message')?.textContent || '';

    let match = false;

    if (keyword === "") {
      match = true;
    } else if (keyword.length <= 2) {
      const lowerKey = keyword.toLowerCase();
      match =
        title.toLowerCase().includes(lowerKey) ||
        preview.toLowerCase().includes(lowerKey) ||
        content.toLowerCase().includes(lowerKey);
    } else {
      match = isMatch(title, keyword) || isMatch(preview, keyword) || isMatch(content, keyword);
    }

    item.style.display = match ? 'flex' : 'none';
    if (match) found = true;
  });

  let noResult = document.getElementById('noResultMsg');
  if (!found) {
    if (!noResult) {
      noResult = document.createElement('div');
      noResult.id = 'noResultMsg';
      noResult.style.textAlign = 'center';
      noResult.style.color = '#888';
      noResult.style.marginTop = '10px';
      noResult.textContent = 'Không có kết quả phù hợp';
      document.getElementById('chatList').appendChild(noResult);
    }
  } else if (noResult) noResult.remove();
});
</script>
